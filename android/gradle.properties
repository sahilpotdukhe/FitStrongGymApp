org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 compiles Kotlin itself instead of via the Kotlin Gradle Plugin (KGP). Keep this ON:
# `false` makes the app and every Flutter plugin fall back to applying KGP, which AGP 9 no
# longer supports. Requires AGP >= 9.0 and Flutter >= 3.47.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.builtInKotlin=true
# Opt out of AGP 9's new Gradle DSL for now -- a separate migration from built-in Kotlin.
# Flipping this to `true` is its own change: it retypes the `android {}` DSL and needs the
# Flutter Gradle Plugin plus every plugin we depend on to support it.
android.newDsl=false
